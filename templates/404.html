{% extends 'base.html' %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-8 col-lg-6 text-center">
    <div class="card p-4 shadow-sm">
      <h1 class="display-4 text-secondary fw-bold">404</h1>
      <h2 class="h4 mb-3">Page Not Found</h2>
      <p class="text-muted mb-4">{{ message|default:"The page you requested could not be found. It may have been moved or deleted." }}</p>
      <div>
        <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-primary">Go to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
