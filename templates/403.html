{% extends 'base.html' %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-8 col-lg-6 text-center">
    <div class="card p-4 shadow-sm border-danger">
      <h1 class="display-4 text-danger fw-bold">403</h1>
      <h2 class="h4 mb-3">Access Forbidden</h2>
      <p class="text-muted mb-4">{{ message|default:"You do not have permission to view this page or perform this action." }}</p>
      <div>
        <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-primary">Return to Dashboard</a>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary ms-2">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
